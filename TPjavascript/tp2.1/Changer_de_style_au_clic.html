<!DOCTYPE html>
<html lang="Fr">
    <head>
        <title>Changer de style au clic</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="Changer_de_style_au_clic.css">
        
    </head>
    <body>
        <div id="color1">
            <p>First row</p>
            <p>Second row</p>
        </div> </br>

        <input type="button" value="change background color" id="button" onclick="color()">

        <script language="javascript">
            let element=document.getElementById("color1");
            var temp=true;
            function color(){
                if(temp){
                    element.setAttribute("id","color2");
                    temp=false;
                }else{
                    element.setAttribute("id","color1");
                    temp=true;
                
                }
            }
            

        </script>
    </body>
</html>
